name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r app/requirements.txt ruff==0.6.9   # streamlit: the demo smoke test
      - name: Lint
        run: ruff check src tests scripts notebooks app
      - name: Tests (synthetic data only)
        run: pytest -q
      - name: Notebooks match their .py sources
        run: python scripts/build_notebooks.py --check
      - name: Notebooks on synthetic data
        env:
          FRAUDRISK_SYNTHETIC: "1"
          MPLBACKEND: Agg
        run: |
          for nb in notebooks/[0-9]*.py; do echo "== $nb"; python "$nb"; done
      - name: Recorded metrics are untouched by synthetic runs
        run: git diff --exit-code reports/metrics
