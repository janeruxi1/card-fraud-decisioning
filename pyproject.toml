[project]
name = "fraudrisk"
version = "0.1.0"
description = "Card-not-present fraud screening: point-in-time features, models, anomaly detection and a cost-based review policy"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
